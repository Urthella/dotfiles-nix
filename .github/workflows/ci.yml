name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the full home-manager generation
        run: nix build .#homeConfigurations.utku.activationPackage --print-build-logs
      - uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
